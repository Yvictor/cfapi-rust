[package]
name = "contract-query-service"
version = "0.1.0"
edition = "2021"

[lib]
name = "contract_query_service"
path = "src/lib.rs"

[dependencies]
parking_lot = "0.12.5"
rmp-serde = "1.3.1"
rust_decimal = "1.42.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "1.0.69"
time = { version = "0.3.47", features = ["formatting", "macros"] }
tokio = { version = "1.52.3", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
serde_json = "1.0.145"
