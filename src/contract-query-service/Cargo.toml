[package]
name = "contract-query-service"
version = "0.1.0"
edition = "2021"

[lib]
name = "contract_query_service"
path = "src/lib.rs"

[features]
default = []
cfapi = ["dep:cfapi"]
runtime = [
    "cfapi",
    "salvo/server",
    "salvo/server-handle",
    "salvo/http1",
    "tokio/net",
    "tokio/rt-multi-thread",
    "tokio/signal",
]

[dependencies]
cfapi = { path = "../cfapi", optional = true }
parking_lot = "0.12.5"
rmp-serde = "1.3.1"
rust_decimal = "1.42.0"
salvo = { version = "=0.95.2", default-features = false, features = ["oapi", "affix-state", "logging"] }
salvo-oapi = { version = "=0.95.2", features = ["scalar"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "1.0.69"
time = { version = "0.3.47", features = ["formatting", "macros"] }
tokio = { version = "1.52.3", features = ["macros", "rt", "sync", "time"] }
ulid = "1.2.1"

[dev-dependencies]
salvo = { version = "=0.95.2", default-features = false, features = ["test"] }
serde_json = "1.0.145"

[[bin]]
name = "contract-query-service"
path = "src/bin/contract-query-service.rs"
required-features = ["runtime"]
